<ion-content [fullscreen]="true" class="map-content">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  
  <div class="home-background">
    <ion-button class="back-button" (click)="goBack()">
      <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
    </ion-button>
    <div id="map"></div>
    <div class="ubic">
      <div class="search-bar">
        <input type="text" placeholder="Tu ubicación" />
        <ion-icon name="search-outline"></ion-icon>
      </div>
      <div class="buttons">
        <button>Precios</button>
        <button>Ciudad</button>
        <button>Comida</button>
      </div>
    </div>
  </div>

  <ion-footer class="footer">
    <ion-tab-bar slot="bottom" class="footer-tab-bar">
      <ion-tab-button tab="mapa" href="#">
        <ion-icon name="map-outline"></ion-icon>
      </ion-tab-button>

      <ion-tab-button tab="inicio" (click)="onHomeButtonPressed()">
        <ion-icon name="home-outline"></ion-icon>
      </ion-tab-button>

      <ion-tab-button tab="perfil" (click)="onProfileButtonPressed()">
        <ion-icon name="person-outline"></ion-icon>
      </ion-tab-button>
    </ion-tab-bar>
  </ion-footer>
</ion-content>
