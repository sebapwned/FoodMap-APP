<ion-content [fullscreen]="true" class="map-content">
  <div class="home-background">
    <ion-button class="back-button" (click)="goBack()" slot="fixed" fill="clear">
      <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
    </ion-button>

    <div *ngFor="let location of locations" class="map-link-container" (click)="openMap(location.url)">
      <ion-img [src]="location.img" [alt]="location.name"></ion-img>
      <div class="description">
        <h2>{{ location.name }}</h2>
        <p>{{ location.description }}</p>
      </div>
    </div>
  </div>

  <ion-footer class="footer">
    <ion-tab-bar slot="bottom" class="footer-tab-bar">
      <ion-tab-button tab="mapa" href="#">
        <ion-icon name="map-outline"></ion-icon>
      </ion-tab-button>

      <ion-tab-button tab="inicio" (click)="onHomeButtonPressed()">
        <ion-icon name="home-outline"></ion-icon>
      </ion-tab-button>

      <ion-tab-button tab="perfil" (click)="onProfileButtonPressed()">
        <ion-icon name="person-outline"></ion-icon>
      </ion-tab-button>
    </ion-tab-bar>
  </ion-footer>
</ion-content>
