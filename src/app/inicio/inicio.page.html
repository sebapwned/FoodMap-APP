<ion-content [fullscreen]="true" class="profile-content">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <div class="home-background">
    <ion-button class="back-button" (click)="goBack()">
      <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
    </ion-button>
    <swiper-container>
      <swiper-slide><img src="assets/images-inicio/promo 1 1.png" alt="Promoción 1"></swiper-slide>
      <swiper-slide><img src="assets/images-inicio/promo 2 1.png" alt="Promoción 2"></swiper-slide>
      <swiper-slide><img src="assets/images-inicio/promo 3 1.png" alt="Promoción 3"></swiper-slide>
    </swiper-container>
  </div>
<ion-footer class="footer">
  <ion-tab-bar slot="bottom" class="footer-tab-bar">
    <ion-tab-button tab="mapa" (click)="onMapButtonPressed()">
      <ion-icon name="map-outline"></ion-icon>
    </ion-tab-button>
    <ion-tab-button tab="inicio" href="#">
      <ion-icon name="home-outline"></ion-icon>
    </ion-tab-button>
    <ion-tab-button tab="perfil" (click)="onProfileButtonPressed()">
      <ion-icon name="person-outline"></ion-icon>
    </ion-tab-button>
  </ion-tab-bar>
</ion-footer>
</ion-content>
