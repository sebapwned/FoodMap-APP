<ion-content [fullscreen]="true" class="login-content">
  <div class="login-background">
    <h1>Bienvenido a Food Map</h1>

  <ion-card class="login-card">

      <form (ngSubmit)="onLoginButtonPressed()">
      <ion-item>
        <ion-label position="floating">E-mail</ion-label>
        <ion-input [(ngModel)]="email" name="email" type="email"></ion-input>
      </ion-item>

      <ion-item>
        <ion-label position="floating">Password</ion-label>
        <ion-input [(ngModel)]="password" name="password" type="password"></ion-input>
      </ion-item>

      <ion-button type="submit" class="login-button" (click)="onLoginButtonPressed()">Iniciar Sesión</ion-button>

      <ion-button fill="outline" class="google-login-button" href="https://accounts.google.com/v3/signin/identifier?continue=https%3A%2F%2Fmail.google.com%2Fmail%2F&ifkv=Ab5oB3poXFswRbD-IMLvnGCr_QAXuu-KN4c4Ka9coEFK_UyYppJIutRmYZ6RORl8OlZWjAWipletEQ&rip=1&sacu=1&service=mail&flowName=GlifWebSignIn&flowEntry=ServiceLogin&dsh=S-2111964797%3A1726202516783331&ddm=0">
        <ion-icon slot="start" name="logo-google"></ion-icon>
        Continuar con Google
      </ion-button>
      </form>
  </ion-card>
  <a class="forgot-password" href="#">¿Olvidaste tu contraseña?</a>
  <div class="logo-container">
    <img src="/assets/images-login/FoodMap_Logo.png" alt="logo img">
  </div>
  <div class="signup-container">
    <span>No tienes una cuenta?</span>
    <a href="/register" (click)="onRegisterButtonPressed()">Registrate</a>
  </div>
</div>
</ion-content>
